<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameHub Indonesia</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #080b12;
    color: white;
    min-height: 100vh;
}

header {
    padding: 18px;
    background: #101522;
    border-bottom: 1px solid #242b3a;
    position: sticky;
    top: 0;
    z-index: 10;
}

.header-inner {
    max-width: 1100px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.logo {
    font-size: 22px;
    font-weight: bold;
}

.logo span {
    color: #00e5ff;
}

.admin-btn {
    border: 0;
    background: #1d2635;
    color: white;
    padding: 10px 15px;
    border-radius: 10px;
    cursor: pointer;
}

.admin-btn:hover {
    background: #293548;
}

.hero {
    max-width: 1100px;
    margin: auto;
    padding: 45px 18px 25px;
}

.hero h1 {
    font-size: 38px;
    margin-bottom: 10px;
}

.hero h1 span {
    color: #00e5ff;
}

.hero p {
    color: #9da7b8;
    line-height: 1.6;
}

.search-box {
    max-width: 1100px;
    margin: 10px auto 25px;
    padding: 0 18px;
}

.search-box input {
    width: 100%;
    padding: 15px;
    border: 1px solid #283244;
    border-radius: 12px;
    background: #111722;
    color: white;
    outline: none;
    font-size: 15px;
}

.search-box input:focus {
    border-color: #00e5ff;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 0 18px 50px;
}

.section-title {
    margin: 25px 0 15px;
    font-size: 22px;
}

.games {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 18px;
}

.game-card {
    background: #111722;
    border: 1px solid #252e3e;
    border-radius: 16px;
    overflow: hidden;
    transition: 0.2s;
}

.game-card:hover {
    transform: translateY(-4px);
    border-color: #00e5ff;
}

.game-image {
    width: 100%;
    height: 145px;
    object-fit: cover;
    background: #1b2330;
}

.game-content {
    padding: 15px;
}

.game-content h3 {
    margin-bottom: 7px;
}

.game-content p {
    color: #929dad;
    font-size: 14px;
    min-height: 40px;
}

.play-btn {
    display: block;
    text-align: center;
    margin-top: 13px;
    padding: 11px;
    border-radius: 10px;
    background: #00e5ff;
    color: #001015;
    text-decoration: none;
    font-weight: bold;
}

.play-btn:hover {
    opacity: 0.85;
}

.admin-panel {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 100;
    padding: 20px;
    overflow-y: auto;
}

.admin-box {
    max-width: 650px;
    margin: 40px auto;
    background: #111722;
    border: 1px solid #293448;
    border-radius: 18px;
    padding: 22px;
}

.admin-box h2 {
    margin-bottom: 18px;
}

.close-btn {
    float: right;
    background: #303948;
    border: 0;
    color: white;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
}

.form-group {
    margin-bottom: 14px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    color: #c4cbd6;
}

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 12px;
    border-radius: 9px;
    border: 1px solid #2b3648;
    background: #080d15;
    color: white;
    outline: none;
}

.form-group textarea {
    min-height: 80px;
    resize: vertical;
}

.save-btn {
    width: 100%;
    padding: 13px;
    border: 0;
    border-radius: 10px;
    background: #00e5ff;
    font-weight: bold;
    cursor: pointer;
}

.admin-games {
    margin-top: 25px;
}

.admin-game {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px;
    margin-top: 10px;
    background: #0b111a;
    border: 1px solid #263143;
    border-radius: 10px;
}

.admin-game-info {
    flex: 1;
}

.admin-game-info strong {
    display: block;
}

.admin-game-info small {
    color: #818b9b;
}

.action-btn {
    border: 0;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    color: white;
}

.edit-btn {
    background: #315b86;
}

.delete-btn {
    background: #a83246;
}

.empty {
    text-align: center;
    color: #8993a3;
    padding: 30px;
    background: #111722;
    border-radius: 15px;
}

footer {
    text-align: center;
    padding: 25px;
    color: #6f7888;
    border-top: 1px solid #1f2734;
}

@media(max-width:600px) {
    .hero h1 {
        font-size: 29px;
    }

    .header-inner {
        align-items: flex-start;
    }

    .admin-game {
        flex-direction: column;
        align-items: stretch;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">
        <div class="logo">
            🎮 <span>GameHub</span> Indonesia
        </div>

        <button class="admin-btn" onclick="openAdmin()">
            👑 Admin
        </button>
    </div>
</header>

<section class="hero">
    <h1>Temukan <span>Game & Web</span> Unik</h1>
    <p>
        Kumpulan game dan website pilihan. Klik game untuk langsung
        menuju website tujuan.
    </p>
</section>

<div class="search-box">
    <input
        type="text"
        id="search"
        placeholder="🔎 Cari game..."
        oninput="renderGames()"
    >
</div>

<main class="container">

    <h2 class="section-title">🎮 Daftar Game</h2>

    <div id="games" class="games"></div>

</main>

<footer>
    © 2026 GameHub Indonesia
</footer>


<!-- ADMIN PANEL -->
<div class="admin-panel" id="adminPanel">

    <div class="admin-box">

        <button class="close-btn" onclick="closeAdmin()">
            ✕
        </button>

        <h2>👑 Panel Admin</h2>

        <div id="loginArea">

            <div class="form-group">
                <label>PIN Admin</label>

                <input
                    type="password"
                    id="adminPin"
                    placeholder="Masukkan PIN"
                >
            </div>

            <button class="save-btn" onclick="loginAdmin()">
                🔐 Masuk Admin
            </button>

        </div>


        <div id="adminArea" style="display:none;">

            <h3 id="formTitle">➕ Tambah Game</h3>

            <br>

            <div class="form-group">
                <label>Nama Game</label>

                <input
                    type="text"
                    id="gameName"
                    placeholder="Contoh: Game Jawa Adventure"
                >
            </div>


            <div class="form-group">
                <label>Deskripsi</label>

                <textarea
                    id="gameDescription"
                    placeholder="Deskripsi singkat game"
                ></textarea>
            </div>


            <div class="form-group">
                <label>URL Gambar</label>

                <input
                    type="url"
                    id="gameImage"
                    placeholder="https://contoh.com/gambar.jpg"
                >
            </div>


            <div class="form-group">
                <label>Link Website Game</label>

                <input
                    type="url"
                    id="gameUrl"
                    placeholder="https://contoh.com"
                >
            </div>


            <button class="save-btn" onclick="saveGame()">
                💾 Simpan Game
            </button>


            <div class="admin-games">

                <h3>📋 Kelola Game</h3>

                <div id="adminGameList"></div>

            </div>

        </div>

    </div>

</div>


<script>

// ================================
// PENGATURAN
// ================================

// Ganti PIN ini jika mau
const ADMIN_PIN = "1234";


// ================================
// DATA GAME AWAL
// ================================

let games = JSON.parse(
    localStorage.getItem("gamehub_games")
) || [

    {
        id: 1,
        name: "Game Jawa Adventure",
        description: "Petualangan seru dengan nuansa Indonesia.",
        image: "https://images.unsplash.com/photo-1511512578047-dfb367046420?w=800",
        url: "https://example.com"
    },

    {
        id: 2,
        name: "Pixel Indonesia",
        description: "Game pixel dengan dunia Indonesia.",
        image: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=800",
        url: "https://example.com"
    }

];


// ID game yang sedang diedit
let editingId = null;


// ================================
// TAMPILKAN GAME
// ================================

function renderGames() {

    const container = document.getElementById("games");

    const search =
        document.getElementById("search").value
        .toLowerCase();

    const filtered = games.filter(game =>
        game.name.toLowerCase().includes(search)
    );


    if (filtered.length === 0) {

        container.innerHTML = `
            <div class="empty">
                Game tidak ditemukan.
            </div>
        `;

        return;
    }


    container.innerHTML = filtered.map(game => `

        <div class="game-card">

            <img
                class="game-image"
                src="${escapeHTML(game.image)}"
                onerror="this.src='https://via.placeholder.com/600x350?text=Game'"
            >

            <div class="game-content">

                <h3>
                    🎮 ${escapeHTML(game.name)}
                </h3>

                <p>
                    ${escapeHTML(game.description)}
                </p>

                <a
                    class="play-btn"
                    href="${escapeHTML(game.url)}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    ▶️ Mainkan / Buka Website
                </a>

            </div>

        </div>

    `).join("");

}


// ================================
// ADMIN
// ================================

function openAdmin() {

    document.getElementById("adminPanel").style.display = "block";

}


function closeAdmin() {

    document.getElementById("adminPanel").style.display = "none";

}


function loginAdmin() {

    const pin =
        document.getElementById("adminPin").value;


    if (pin === ADMIN_PIN) {

        document.getElementById("loginArea").style.display = "none";

        document.getElementById("adminArea").style.display = "block";

        renderAdminGames();

    } else {

        alert("❌ PIN admin salah!");

    }

}


// ================================
// SIMPAN GAME
// ================================

function saveGame() {

    const name =
        document.getElementById("gameName").value.trim();

    const description =
        document.getElementById("gameDescription").value.trim();

    const image =
        document.getElementById("gameImage").value.trim();

    const url =
        document.getElementById("gameUrl").value.trim();


    if (!name || !url) {

        alert("Nama game dan link website wajib diisi!");

        return;
    }


    if (editingId !== null) {

        const game =
            games.find(g => g.id === editingId);

        game.name = name;
        game.description = description;
        game.image = image;
        game.url = url;

        editingId = null;

        document.getElementById("formTitle").innerText =
            "➕ Tambah Game";

    } else {

        games.push({

            id: Date.now(),

            name: name,

            description:
                description || "Game pilihan.",

            image:
                image || "https://via.placeholder.com/600x350?text=Game",

            url: url

        });

    }


    localStorage.setItem(
        "gamehub_games",
        JSON.stringify(games)
    );


    clearForm();

    renderGames();

    renderAdminGames();

    alert("✅ Game berhasil disimpan!");

}


// ================================
// EDIT GAME
// ================================

function editGame(id) {

    const game =
        games.find(g => g.id === id);

    if (!game) return;


    editingId = id;


    document.getElementById("gameName").value =
        game.name;

    document.getElementById("gameDescription").value =
        game.description;

    document.getElementById("gameImage").value =
        game.image;

    document.getElementById("gameUrl").value =
        game.url;


    document.getElementById("formTitle").innerText =
        "✏️ Edit Game";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


// ================================
// HAPUS GAME
// ================================

function deleteGame(id) {

    if (!confirm("Yakin ingin menghapus game ini?")) {
        return;
    }


    games =
        games.filter(game => game.id !== id);


    localStorage.setItem(
        "gamehub_games",
        JSON.stringify(games)
    );


    renderGames();

    renderAdminGames();

}


// ================================
// DAFTAR GAME ADMIN
// ================================

function renderAdminGames() {

    const container =
        document.getElementById("adminGameList");


    if (games.length === 0) {

        container.innerHTML =
            "<p>Tidak ada game.</p>";

        return;
    }


    container.innerHTML =
        games.map(game => `

            <div class="admin-game">

                <div class="admin-game-info">

                    <strong>
                        🎮 ${escapeHTML(game.name)}
                    </strong>

                    <small>
                        ${escapeHTML(game.url)}
                    </small>

                </div>

                <div>

                    <button
                        class="action-btn edit-btn"
                        onclick="editGame(${game.id})"
                    >
                        ✏️
                    </button>

                    <button
                        class="action-btn delete-btn"
                        onclick="deleteGame(${game.id})"
                    >
                        🗑️
                    </button>

                </div>

            </div>

        `).join("");

}


// ================================
// BERSIHKAN FORM
// ================================

function clearForm() {

    document.getElementById("gameName").value = "";

    document.getElementById("gameDescription").value = "";

    document.getElementById("gameImage").value = "";

    document.getElementById("gameUrl").value = "";

}


// ================================
// KEAMANAN TAMPILAN HTML
// ================================

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


// ================================
// JALANKAN
// ================================

renderGames();

</script>

</body>
</html>
